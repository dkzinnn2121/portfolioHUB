<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Slides Portfolio</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .slide { background: #020617; padding: 60px; border-radius: 12px; border: 2px solid #64ffda; max-width: 800px; }
        h1 { color: #64ffda; font-size: 48px; }
        .tag { color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="slide">
        <p class="tag">Engenharia & Tecnologia</p>
        <h1>PortfolioHUB</h1>
        <p>Francisco Rafael</p>
        <hr style="border: 0; height: 1px; background: #64ffda; margin: 20px 0;">
        <p>Projetos de Física | Programação C | Circuitos Elétricos</p>
    </div>
</body>
</html>
